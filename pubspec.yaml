name: sakeena_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  camera: ^0.12.0+1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: 20.0.0
  flutter_localization: ^0.4.0
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  get_it: ^9.2.1
  go_router: ^17.2.2
  google_fonts: ^8.0.2
  image: ^4.8.0
  image_picker: ^1.2.1
  loading_animation_widget: ^1.3.0
  lottie: ^3.3.3
  package_info_plus: ^8.3.0
  permission_handler: ^12.0.1
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.5
  speech_to_text: ^7.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sakeena_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-VariableFont_wght.ttf
